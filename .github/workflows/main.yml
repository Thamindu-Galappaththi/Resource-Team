name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        with:
          composer-options: "--prefer-source --no-progress"

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run database migrations (test DB)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan migrate --force

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/Resource-Team

            echo ">>> Syncing code with origin/main"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo ">>> Installing PHP dependencies"
            composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

            echo ">>> Installing Node dependencies and building assets"
            npm ci --prefer-offline --no-audit --no-fund
            npm run build

            echo ">>> Running migrations"
            php artisan migrate --force

            echo ">>> Rebuilding caches"
            php artisan config:clear
            php artisan config:cache
            php artisan route:clear
            php artisan route:cache
            php artisan view:clear
            php artisan view:cache

            echo ">>> Restarting queue workers"
            php artisan queue:restart

            echo ">>> Deploy finished successfully"

      - name: Verify deployment
        run: |
          curl -f -k https://dpdlab1.slt.lk:4444/login || exit 1
